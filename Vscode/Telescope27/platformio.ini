; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
board = esp32dev
platform = espressif32@6.5.0
framework = arduino

build_src_filter = +<teles_mDNS_vitesse.cpp> +<IRController.cpp>
;build_src_filter = +<vitesse.cpp> +<IRController.cpp>
;build_src_filter = +<Demo_FastAccelStepper.cpp>

monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0

upload_protocol = espota
upload_port = teles.local
;upload_port = 192.168.0.12   ;ici
;upload_port = 192.168.0.70  ; MVD
;upload_port = 172.168.42.70  ;note14
;upload_port = COM4
;monitor_port = COM4
;monitor_port = COM3
board_build.partitions = partitions_custom.csv


board_build.filesystem = littlefs


build_flags =     
    -Wall
    -Wextra
    -Wunused-variable   ; variablre non utilisée
	;-Wunused-function   ; fonction non utilisée



lib_deps = 
	IRremote
	bodmer/TFT_eFEX@^0.0.8
	bodmer/TFT_eSPI@^2.5.43
	bodmer/JPEGDecoder@^2.0.0
	bblanchon/ArduinoJson@^6.21.3
	https://github.com/me-no-dev/AsyncTCP.git
	gin66/FastAccelStepper@0.30.14
	davidarmstrong/SiderealPlanets@^1.4.0
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	diyables/DIYables_IRcontroller@^1.0.0
	WebSockets
	arduino-libraries/NTPClient@^3.2.1
	khoih-prog/AsyncHTTPRequest_Generic@^1.13.0

	
